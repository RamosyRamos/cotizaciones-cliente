<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tu cotización · Taller Ramos y Ramos">
  <meta property="og:description" content="Especialistas en Mercedes-Benz. Revisá tu cotización de repuestos y aprobá los que quieras.">
  <meta property="og:image" content="https://cotizaciones.ramosyramoscr.com/logo-3x.png">
  <meta property="og:image:width" content="144">
  <meta property="og:image:height" content="144">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Tu cotización · Taller Ramos y Ramos">
  <meta name="twitter:description" content="Especialistas en Mercedes-Benz. Revisá tu cotización de repuestos.">
  <meta name="twitter:image" content="https://cotizaciones.ramosyramoscr.com/logo-3x.png">
  <meta name="description" content="Tu cotización de repuestos Mercedes-Benz · Taller Ramos y Ramos">
  <title>Taller Ramos y Ramos – Tu Cotización</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600;700&family=Titillium+Web:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:     #F2F3F5;
      --bg2:    #ECEEF1;
      --bg3:    #E2E5EA;
      --borde2: rgba(31,41,51,0.30);
      --card:   #FFFFFF;
      --borde:  #D5D9DF;
      --texto:  #1F2933;
      --muted:  #5C6470;
      --marca:  #B83A2E;
      --oro:    #8A6A1F;
      --ok:     #1E7F4F;
      --alerta: #B54708;
      --sombra: 0 1px 2px rgba(0,0,0,.06);
      --radio:  8px;
      --mono:   'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Titillium Web', sans-serif; background: var(--bg); color: var(--texto); min-height: 100vh; font-variant-numeric: tabular-nums; }

    .header {
      background: var(--card);
      padding: 16px 24px; display: flex; align-items: center; gap: 14px;
      position: sticky; top: 0; z-index: 100;
      box-shadow: var(--sombra);
    }
    /* Único acento de marca: la línea roja bajo el header */
    .header::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0;
      height: 3px; background: var(--marca);
    }
    .logo {
      width: 44px; height: 44px;
      border-radius: var(--radio); flex-shrink: 0;
      object-fit: contain;
    }
    .header h1 { font-family: 'Titillium Web', sans-serif; font-size: 24px; letter-spacing: 2px; line-height: 1; color: var(--texto); }
    .header p { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
    .vip-badge {
      display: none;
      margin-top: 8px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: var(--card);
      color: var(--oro);
      border: 1px solid var(--oro);
    }

    .wrap { max-width: 860px; margin: 0 auto; padding: 24px 18px 80px; }

    /* Card única: blanco, borde, radio 8, sombra sutil, padding 20, separación 16 */
    .card, .cliente-hero, .cliente-repuesto, .resumen-box, .instrucciones {
      background: var(--card); border: 1px solid var(--borde);
      border-radius: var(--radio); padding: 20px; margin-bottom: 16px;
      box-shadow: var(--sombra);
    }
    .card.mt, .mt { margin-top: 16px; margin-bottom: 0; }
    .card-title {
      font-family: 'Titillium Web', sans-serif; font-size: 16px; letter-spacing: 1.5px;
      color: var(--marca); margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .card-title::before {
      content: ''; width: 3px; height: 16px; background: var(--marca);
      border-radius: 2px; display: inline-block;
    }
    /* Etiqueta de sección: mayúsculas pequeñas mono, como el resto de labels */
    .sec-label {
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; color: var(--muted);
      margin-bottom: 12px;
    }
    .sec-label.ok { color: var(--ok); }
    /* Tres niveles y no más: página var(--bg) → tarjeta var(--card) → caja interna var(--bg2) */
    .caja {
      background: var(--bg2); border: 1px solid var(--borde);
      border-radius: var(--radio); padding: 14px;
    }
    .caja.lista { padding: 0 14px; }
    /* Notas con barra izquierda de 3px: el color va en la barra, no en el fondo */
    .nota { border-left: 3px solid var(--borde); padding: 4px 0 4px 14px; color: var(--texto); font-size: 14px; line-height: 1.6; }
    .nota.alerta { border-left-color: var(--alerta); }
    .nota.ok { border-left-color: var(--ok); }
    .nota.marca { border-left-color: var(--marca); }
    .barra-ok { border-left: 3px solid var(--ok); }
    .barra-alerta { border-left: 3px solid var(--alerta); }
    /* Tabla de resumen de montos: filas con línea, sin cajas de color */
    .tabla-resumen { background: var(--bg2); border: 1px solid var(--borde); border-radius: var(--radio); padding: 0 14px; margin-top: 12px; }
    .tabla-resumen .fila {
      display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid var(--borde);
    }
    .tabla-resumen .fila:last-child { border-bottom: none; }
    .tabla-resumen .fila .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; font-family: var(--mono); }
    .tabla-resumen .fila .monto { font-family: 'Titillium Web', sans-serif; font-size: 22px; color: var(--texto); white-space: nowrap; text-align: right; }
    .tabla-resumen .fila .monto.marca { color: var(--marca); }
    .tabla-resumen .fila .monto.ok { color: var(--ok); }
    .tabla-resumen .fila.total .monto { font-size: 26px; font-weight: 700; }

    .tag {
      font-size: 11px; font-weight: 700; padding: 3px 10px;
      border-radius: 20px; letter-spacing: 0.5px; text-transform: uppercase;
      background: var(--card); border: 1px solid var(--borde);
    }
    .tag-critico, .tag-crítico, .tag-cr\00EDtico { color: var(--marca); border-color: var(--marca); }
    .tag-recomendado { color: var(--oro); border-color: var(--oro); }
    .tag-opcional { color: var(--ok); border-color: var(--ok); }

    .mf{display:inline-block;width:16px;height:11px;border-radius:1.5px;overflow:hidden;border:.5px solid rgba(0,0,0,.12);vertical-align:-1px;position:relative}
    .mf.us{background:repeating-linear-gradient(#b22234 0 1.57px,#fff 1.57px 3.14px)}
    .mf.us::after{content:'';position:absolute;top:0;left:0;width:42%;height:55%;background:#3c3b6e}
    .mf.eu{background:
      radial-gradient(circle 0.8px at 50% 16%, #FFCC00 97%, transparent 100%),
      radial-gradient(circle 0.8px at 74% 27%, #FFCC00 97%, transparent 100%),
      radial-gradient(circle 0.8px at 83% 50%, #FFCC00 97%, transparent 100%),
      radial-gradient(circle 0.8px at 74% 73%, #FFCC00 97%, transparent 100%),
      radial-gradient(circle 0.8px at 50% 84%, #FFCC00 97%, transparent 100%),
      radial-gradient(circle 0.8px at 26% 73%, #FFCC00 97%, transparent 100%),
      radial-gradient(circle 0.8px at 17% 50%, #FFCC00 97%, transparent 100%),
      radial-gradient(circle 0.8px at 26% 27%, #FFCC00 97%, transparent 100%),
      #003399}
    .mf.eu::after{content:''}
    .mf.cn{background:radial-gradient(circle 2.2px at 22% 36%, #FFDE00 97%, transparent 100%), #DE2910}
    .mf.cn::after{content:''}

    .cliente-hero { padding: 24px; text-align: center; }
    .cliente-hero h2 { font-family: 'Titillium Web', sans-serif; font-size: 26px; letter-spacing: 2px; color: var(--texto); }
    .cliente-hero p { color: var(--muted); font-size: 14px; margin-top: 6px; }
    .cliente-hero .taller-name { color: var(--marca); font-weight: 700; }

    .instrucciones { font-size: 14px; }
    /* Nota "no proforma": texto normal con barra izquierda de alerta, sin fondo */
    .nota-proforma { background: var(--bg2); border: 1px solid var(--borde); border-left: 3px solid var(--alerta); border-radius: var(--radio); padding: 12px 14px; color: var(--texto); font-size: 13px; line-height: 1.55; margin-bottom: 16px; }
    .nota-proforma b { color: var(--texto); font-weight: 700; }

    .cliente-repuesto { transition: border-color 0.2s; }
    .cliente-repuesto.tiene-seleccion { border-color: var(--ok); }
    .cliente-repuesto-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
    .cliente-repuesto-nombre { font-weight: 700; font-size: 17px; }
    .cliente-repuesto-nota { font-size: 13px; color: var(--muted); margin-top: 5px; font-style: italic; }

    .opciones-cliente { display: flex; flex-direction: column; gap: 8px; }
    .opcion-cliente {
      display: flex; align-items: center; gap: 12px;
      background: var(--bg2); border: 1px solid var(--borde);
      border-radius: var(--radio); padding: 12px 14px; cursor: pointer; transition: border-color 0.15s, background 0.15s;
    }
    .opcion-cliente:hover { background: var(--bg3); border-color: var(--borde2); }
    .opcion-cliente.seleccionada { background: var(--bg3); border-color: var(--borde2); box-shadow: inset 3px 0 0 var(--ok); }
    .radio-dot {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid var(--muted); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; transition: all 0.15s;
    }
    .opcion-cliente.seleccionada .radio-dot { border-color: var(--ok); background: var(--ok); }
    .radio-dot::after {
      content: ''; width: 7px; height: 7px; border-radius: 50%;
      background: var(--card); display: none;
    }
    .opcion-cliente.seleccionada .radio-dot::after { display: block; }
    .opcion-cliente-info { flex: 1; min-width: 0; }
    .opcion-cliente-titulo { font-weight: 600; font-size: 14px; }
    .opcion-cliente-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .opcion-cliente-precio {
      font-family: 'Titillium Web', sans-serif; font-size: 20px;
      color: var(--ok); letter-spacing: 0.5px; white-space: nowrap; text-align: right;
    }
    .no-seleccionar {
      display: flex; align-items: center; gap: 12px;
      background: var(--bg2); border: 1px dashed var(--borde);
      border-radius: var(--radio); padding: 12px 14px; cursor: pointer; transition: border-color 0.15s, background 0.15s; margin-top: 8px;
    }
    .no-seleccionar:hover { background: var(--bg3); border-color: var(--borde2); }
    .no-seleccionar.seleccionada { background: var(--bg3); border-color: var(--borde2); box-shadow: inset 3px 0 0 var(--muted); }
    .no-seleccionar span { font-size: 13px; color: var(--muted); }

    .resumen-box { margin-top: 16px; margin-bottom: 0; }
    .resumen-box h3 { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
    .resumen-item { padding: 12px 0; border-bottom: 1px solid var(--borde); }
    .resumen-item:last-of-type { border-bottom: none; }
    .caja.lista > div:last-child, .caja.lista > .resumen-item:last-child { border-bottom: none; }
    .resumen-item-nombre { font-weight: 600; font-size: 14px; margin-bottom: 3px; }
    .resumen-item-det { font-size: 14px; color: var(--muted); }
    .resumen-item-precio { font-family: 'Titillium Web', sans-serif; font-size: 20px; color: var(--ok); white-space: nowrap; text-align: right; }
    /* Total: fila de tabla con línea superior, sin caja de color */
    .resumen-total {
      border-top: 1px solid var(--borde); padding: 14px 0 0; margin-top: 14px;
      display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    }
    .resumen-total span { font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--muted); }
    .resumen-total .monto-total { font-family: 'Titillium Web', sans-serif; font-size: 30px; font-weight: 700; color: var(--texto); letter-spacing: 0; text-transform: none; text-align: right; }

    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 10px 18px; min-height: 44px; border: none; border-radius: var(--radio);
      font-family: 'Titillium Web', sans-serif; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.15s; text-decoration: none; white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    /* Confirmar selección: no abre WhatsApp — botón oscuro propio */
    .btn-navy { background: var(--texto); color: #fff; }
    .btn-navy:hover { filter: brightness(1.3); }
    .btn-navy:disabled { background: var(--muted); color: var(--card); filter: none; cursor: not-allowed; }

    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    #snackbar {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      padding: 13px 22px; border-radius: var(--radio); font-size: 14px; font-weight: 600;
      z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none;
      box-shadow: 0 4px 16px rgba(0,0,0,.18);
    }
    #snackbar.show { opacity: 1; }
    #snackbar.ok { background: var(--ok); color: var(--card); }
    #snackbar.err { background: var(--marca); color: var(--card); }

    .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
    .empty .icon { font-size: 48px; margin-bottom: 12px; }

    @media (max-width: 640px) {
      .btn { width: 100%; justify-content: center; }
      .resumen-total { flex-direction: column; gap: 6px; text-align: center; }
    }
    /* Seguimiento (en camino / en taller): badge del hero y fila de tiempos que aplica */
    .badge-estado { display:inline-block; margin-top:12px; padding:5px 12px; border-radius:999px; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:0.8px; text-transform:uppercase; color:var(--texto); background:var(--card); border:1px solid var(--borde); }
    .fila-tiempo { padding:6px 10px; border-radius:var(--radio); border:1px solid transparent; }
    .fila-tiempo.aplica { background:var(--card); border-color:var(--borde); box-shadow: inset 3px 0 0 var(--ok); }
    .fila-tiempo-tag { font-size:10px; font-weight:700; color:var(--ok); text-transform:uppercase; letter-spacing:0.6px; margin-left:6px; }
    @media (max-width: 600px) {
      .pago-grid-2col { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 480px) {
      .header { padding: 12px 16px; gap: 10px; }
    }
    /* Toggle de idioma (ES · EN) y leyenda de traducción — mono chico, discreto */
    .lang-toggle { margin-left:auto; align-self:flex-start; display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11px; letter-spacing:1px; color:var(--muted); }
    .lang-toggle button { background:none; border:none; padding:4px 2px; color:var(--muted); font:inherit; cursor:pointer; opacity:0.8; }
    .lang-toggle button.on { color:var(--muted); font-weight:700; opacity:1; text-decoration:underline; text-underline-offset:3px; }
    .trad-leyenda { text-align:center; font-size:11.5px; color:var(--muted); margin-top:18px; }
    .trad-leyenda button { background:none; border:none; padding:0; color:var(--texto); font:inherit; text-decoration:underline; cursor:pointer; }
  </style>
</head>
<body>

<div class="header">
  <img src="logo-1x.png" srcset="logo-1x.png 1x, logo-2x.png 2x, logo-3x.png 3x" alt="Taller Ramos y Ramos" class="logo">
  <div>
    <h1>Taller Ramos y Ramos</h1>
    <p id="headerSub" data-i18n="header.sub">Tu cotización personalizada</p>
    <div id="vipBadge" class="vip-badge" data-i18n="header.vip">★ Precio VIP / Al costo</div>
  </div>
  <div class="lang-toggle" id="langToggle" aria-label="Idioma / Language"><button type="button" data-lang="es">ES</button><span>·</span><button type="button" data-lang="en">EN</button></div>
</div>

<div class="wrap" id="appRoot">
  <div class="empty"><div class="icon">⏳</div><p data-i18n="cargando">Cargando tu cotización...</p></div>
</div>
<div id="snackbar"></div>

<script>
const SUPABASE_URL = 'https://lnsglpvobvfzbxpmyagc.supabase.co';
// RPCs públicos de la página (lote 1): la puerta es el uuid, la validación y
// la lista blanca de campos viven en el servidor (cotizacion_publica_get /
// cotizacion_publica_aprobar). Devuelven jsonb; {error: código} en fallo.
async function rpcPublico(fn, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
const SUPABASE_KEY = 'sb_publishable_xlfpGDooN_Q2m7mOlAVpyg_Ew4Obv18';
// Reseña de Google (vista de cierre). Vacío ⇒ el botón no se renderiza.
const GOOGLE_REVIEW_URL = 'https://g.page/r/CToGsJW0_zc1EBM/review';

// ── i18n (es/en) ──────────────────────────────────────────────────────────
// TODAS las cadenas visibles al cliente viven acá. ES = texto original byte a
// byte; EN con el glosario del taller (quote, deposit, part, workshop, business
// days, VAT…). Valores-función para plurales. Resolución del idioma:
// localStorage 'cot_idioma' (toggle) > clientes.idioma > navigator.language.
const I18N = {

    'no': 'No',

    'error.reenviar': 'Pedile a tu taller que te reenvíe el link.',

    'error.no_encontrada': 'Cotización no encontrada.',
    'error.cargar': 'No se pudo cargar la cotización. Intentá de nuevo.',

    'err.seleccion_invalida': 'La selección no coincide con la cotización actual. Recargá la página y volvé a elegir.',
    'err.precios_incompletos': 'Una opción no tiene precio final; escribinos y la revisamos.',
    'err.nada_aprobado': 'Seleccioná al menos un repuesto para aprobar.',
    'err.pago_invalido': 'El monto a abonar no es válido. Revisalo e intentá de nuevo.',
    'err.generico': 'No se pudo aprobar. Probá de nuevo o escribinos.',
    // catálogo (origen / prioridad / estado de la opción)
    'origen.usa': 'Estados Unidos',
    'origen.europa': 'Europa',
    'origen.china': 'China',
    'prio.critico': 'Crítico',
    'prio.recomendado': 'Recomendado',
    'prio.opcional': 'Opcional',
    'estado.nuevo': 'Nuevo',
    'estado.usado': 'Usado',

    // vista aprobada (A1/A2/A3)
    'ap.resumen_pedido': 'Resumen de tu pedido',

    'ap.enviar_comprobante': 'Enviar comprobante de pago',
    'ap.hero_aprobada': '¡Cotización aprobada!',
    'ap.aprobada_el': 'Aprobada el {fecha}',
    'ap.ya_abonaste': '✓ Ya abonaste',
    'ap.saldo_linea': 'Saldo del total: <strong style="color:var(--muted);">{monto}</strong> — se paga contra entrega.',
    'ap.a1_intro': 'Tu selección quedó registrada. Para <strong style="color:var(--texto);">iniciar el pedido</strong>, transferí el adelanto del 50% a cualquiera de las cuentas de abajo.',
    'ap.a1_intro_sin_total': 'Tu selección ya fue registrada. Para iniciar el pedido, transferí el adelanto del 50% a cualquiera de las cuentas de abajo.',
    'ap.a1_intro_vip': 'Tu selección quedó registrada. Como cliente VIP no requerís adelanto: el taller ya procede con el pedido.',
    'ap.total_aprobado': 'Total aprobado',
    'ap.adelanto_requerido': 'Adelanto requerido 50%',
    'ap.a2_intro': 'Ya registramos tu abono. Para <strong style="color:var(--texto);">completar el adelanto</strong> transferí lo que falta a cualquiera de las cuentas de abajo.',
    'ap.falta_adelanto': 'Falta del adelanto',
    'ap.adelanto_cubierto': '✓ Adelanto cubierto',
    'ap.taller_procedera': 'El taller procederá con el pedido.',

    // seguimiento (C en camino / D en taller)
    'seg.badge_dias': ({ dias }) => dias === 0 ? 'Pedido recién realizado' : `${dias} día${dias === 1 ? ' hábil' : 's hábiles'} en camino`,

let idioma = 'es';          // idioma vigente ('es' | 'en')
let idiomaCliente = null;   // clientes.idioma del select (llega con la cotización)
let vistaActual = null;     // re-render de la vista en pantalla (toggle de idioma)

function idiomaOverride() {
  try { const v = localStorage.getItem('cot_idioma'); return v === 'es' || v === 'en' ? v : null; } catch (_) { return null; }
}
function resolverIdioma() {
  return idiomaOverride() || idiomaCliente || (/^en/i.test(navigator.language || '') ? 'en' : 'es');
}
// t(key, vars): interpolación {var}; valores-función reciben vars (plurales).
function t(key, vars) {
  const dic = I18N[idioma] || I18N.es;
  const v = dic[key] != null ? dic[key] : (I18N.es[key] != null ? I18N.es[key] : key);
  if (typeof v === 'function') return v(vars || {});
  return vars ? v.replace(/\{(\w+)\}/g, (_, k) => (vars[k] != null ? vars[k] : '')) : v;
}
// Prioridad del repuesto y estado de la opción son catálogos chicos del Taller:
// se traducen por mapa; un valor desconocido se muestra tal cual.
function prioLabel(p) {
  const k = 'prio.' + String(p || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return I18N.es[k] != null ? t(k) : (p || '');
}
function estadoLabel(e) {
  const k = 'estado.' + String(e || '').toLowerCase().trim();
  return I18N.es[k] != null ? t(k) : (e || '');
}
function aplicarIdioma() {
  document.documentElement.lang = idioma;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('#langToggle button').forEach(b => b.classList.toggle('on', b.dataset.lang === idioma));
}
function redibujar() { if (vistaActual) vistaActual(); pintarEstadoTrad(); }
function setIdioma(l) {
  if (l !== 'es' && l !== 'en') return;
  try { localStorage.setItem('cot_idioma', l); } catch (_) {}
  idioma = l;
  aplicarIdioma();
  if (l === 'en') asegurarTraduccion();   // no bloquea: pinta originales al 0.6 y re-renderiza al llegar
  redibujar();
}

// ── Texto libre traducido (clientes en inglés) ────────────────────────────
// Edge Function `traducir` del proyecto principal, puerta pública por
// cotizacion_id (misma que el link). Se traducen SOLO repuestos[].nombre,
// opciones[].calidad y opciones[].garantia — nunca marca, origen, nombre del
// cliente/vehículo ni montos. Un solo batch por cotización; caché en memoria;
// cualquier fallo → se muestran los originales en español, sin leyenda.
const TRAD_URL = `${SUPABASE_URL}/functions/v1/traducir`;
const TRAD_TIMEOUT_MS = 20000;
const TRAD_LOTE = 60;
const TRAD_MAX_CHARS = 2000;
const _tradCache = new Map();   // texto(trim) → traducción

async function _pedirLoteTrad(textos, cotizacionId) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TRAD_TIMEOUT_MS);
  try {
    const res = await fetch(TRAD_URL, {
      method: 'POST',
      signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_KEY },
      body: JSON.stringify({ textos, idioma: 'en', cotizacion_id: cotizacionId }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const tr = data && data.traducciones;
    if (!Array.isArray(tr) || tr.length !== textos.length) throw new Error('respuesta desalineada');
    return tr;
  } finally {
    clearTimeout(timer);
  }
}
// traducirTextos(textos, cotizacionId) → { textos, ok }. NUNCA lanza.
async function traducirTextos(textos, cotizacionId) {
  const originales = (Array.isArray(textos) ? textos : []).map(x => (x == null ? '' : String(x)));
  if (originales.length === 0) return { textos: originales, ok: true };
  const pendientes = [];
  const vistos = new Set();
  for (const x of originales) {
    const k = x.trim();
    if (!k || k.length > TRAD_MAX_CHARS || _tradCache.has(k) || vistos.has(k)) continue;
    vistos.add(k); pendientes.push(k);
  }
  let ok = true;
  try {
    for (let i = 0; i < pendientes.length; i += TRAD_LOTE) {
      const lote = pendientes.slice(i, i + TRAD_LOTE);
      const tr = await _pedirLoteTrad(lote, cotizacionId);
      lote.forEach((k, j) => { if (typeof tr[j] === 'string' && tr[j]) _tradCache.set(k, tr[j]); });
    }
  } catch (e) {
    console.warn('[traducirTextos]', e && e.name === 'AbortError' ? 'timeout' : (e && e.message) || e);
    ok = false;
  }
  if (!ok) return { textos: originales, ok: false };
  return { textos: originales.map(x => { const k = x.trim(); return k ? (_tradCache.get(k) ?? x) : x; }), ok: true };
}

let filaActual = null;          // row de la cotización en pantalla
const mapaTrad = new Map();     // original(trim) → traducción
let tradEstado = 'no';          // 'no' | 'cargando' | 'ok' | 'fallo'
let verOriginal = false;        // toggle de la leyenda

function textosLibresDe(row) {
  const out = [], seen = new Set();
  const add = x => { if (typeof x !== 'string') return; const k = x.trim(); if (!k || seen.has(k)) return; seen.add(k); out.push(k); };
  for (const l of (row && row.lineas) || []) {
    add(l && l.nombre);
    for (const op of (l && l.opciones) || []) { add(op && op.calidad); add(op && op.garantia); }
    if (l && l.opcion) { add(l.opcion.calidad); add(l.opcion.garantia); }
  }
  return out;
}
// tx(s): original → traducción (o el mismo string si no aplica).
function tx(x) {
  if (idioma !== 'en' || verOriginal || typeof x !== 'string' || !x || mapaTrad.size === 0) return x;
  return mapaTrad.get(x.trim()) ?? x;
}
async function asegurarTraduccion() {
  if (idioma !== 'en' || !filaActual || tradEstado === 'cargando' || tradEstado === 'ok') return;
  const lista = textosLibresDe(filaActual);
  if (lista.length === 0) { tradEstado = 'ok'; return; }
  tradEstado = 'cargando';
  pintarEstadoTrad();
  const r = await traducirTextos(lista, filaActual.id);
  if (r.ok) {
    lista.forEach((o, i) => { const v = r.textos[i]; if (v && v !== o) mapaTrad.set(o, v); });
    tradEstado = 'ok';
  } else {
    tradEstado = 'fallo';
  }
  redibujar();
}
// Opacidad 0.6 mientras llega la traducción + leyenda al pie (solo en EN con traducciones).
function pintarEstadoTrad() {
  const root = document.getElementById('appRoot');
  if (!root) return;
  root.style.opacity = (idioma === 'en' && tradEstado === 'cargando') ? '0.6' : '';
  const prev = document.getElementById('tradLeyenda');
  if (prev) prev.remove();
  if (idioma !== 'en' || tradEstado !== 'ok' || mapaTrad.size === 0 || !vistaActual) return;
  const div = document.createElement('div');
  div.id = 'tradLeyenda';
  div.className = 'trad-leyenda';
  div.innerHTML = verOriginal
    ? `<button type="button" id="tradToggle">${t('trad.ver_traduccion')}</button>`
    : `${t('trad.leyenda')} · <button type="button" id="tradToggle">${t('trad.ver_original')}</button>`;
  root.appendChild(div);
  document.getElementById('tradToggle').addEventListener('click', () => { verOriginal = !verOriginal; redibujar(); });
}

function fCRC(n) {
  return '₡' + Number(n||0).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function copiarTexto(txt, btn) {
  navigator.clipboard.writeText(txt).catch(() => {});
  if (btn) {
    const orig = btn.textContent;
    btn.textContent = '✅';
    btn.style.color = 'var(--ok)';
    setTimeout(() => { btn.textContent = orig; btn.style.color = ''; }, 1500);
  }
}

function snack(msg, ok=true) {

const ORIGEN_INFO = {

};
const origenKey = o => (ORIGEN_INFO[o] ? o : 'usa');

// Fechas SIEMPRE en hora de Costa Rica (el navegador del cliente puede estar en
// otra zona). Un 'YYYY-MM-DD' suelto (columna date, p. ej. fecha_agendado) se
// arma como fecha civil: new Date('2026-08-25') sería medianoche UTC = el día
// anterior en CR. Locale por idioma: es-CR "4 de septiembre de 2026" /
// en-US "September 4, 2026" (mismo formato que los PDFs del Taller).
const TZ_CR = 'America/Costa_Rica';
function fechaCR(iso, opts = {}, lang = idioma) {
  if (!iso) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso));
  const d = m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], 12)) : new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleDateString(lang === 'en' ? 'en-US' : 'es-CR', { timeZone: TZ_CR, day: 'numeric', month: 'long', year: 'numeric', ...opts });
}
// Días HÁBILES (L-V, sin feriados) transcurridos desde `iso` hasta hoy, ambos
// como fecha civil CR. El día hábil EN CURSO cuenta: pedido y visto el mismo
// lunes → 1; pedido lunes visto viernes → 5; pedido viernes visto lunes → 2.
// Si `iso` cae en fin de semana, la partida se corre al lunes siguiente
// (sábado visto el lunes → 1); 0 solo cuando aún no arrancó ningún hábil
// (pedido sábado visto el domingo). null si no hay fecha.
function diasHabilesDesde(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  // Fecha civil CR como Date UTC a medianoche: getUTCDay() = día de semana EN CR.
  const civil = x => {
    const p = new Intl.DateTimeFormat('en-CA', { timeZone: TZ_CR, year: 'numeric', month: '2-digit', day: '2-digit' }).format(x);
    const [y, mo, da] = p.split('-').map(Number);
    return Date.UTC(y, mo - 1, da);
  };
  const DIA = 86400000;
  let desde = civil(d);
  const hoy = civil(new Date());
  const dow0 = new Date(desde).getUTCDay();               // 0=domingo … 6=sábado
  if (dow0 === 6) desde += 2 * DIA;                       // sábado → lunes
  else if (dow0 === 0) desde += DIA;                      // domingo → lunes
  let n = 0;
  for (let t = desde; t <= hoy; t += DIA) {               // inclusive: el hábil en curso cuenta
    const dow = new Date(t).getUTCDay();
    if (dow >= 1 && dow <= 5) n++;
  }
  return n;                                               // 0 solo en finde sin hábiles corridos
}

// UUID from ?id= (404 redirect)
const params = new URLSearchParams(location.search);
const cotId = params.get('id');
// Modo vista previa interna (?preview=1): no registra vista ni permite aprobar
const isPreview = params.has('preview');

function showError(key) {
  vistaActual = () => showError(key);

async function cargar() {
  if (!cotId) { showError('error.link'); return; }
  if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(cotId)) {
    showError('error.link');
    return;
  }

  try {
    // Lote 1 (auditoría 2026-09-06): lista blanca server-side. El RPC solo
    // devuelve cotizaciones visibles (no archivadas, no por_cotizar/perdido,
    // cotizado solo si enviada/publicada) y nunca precioUSD/transUSD/
    // numero_parte/suplidor. Del cliente: nombre/apellido/idioma.
    const row = await rpcPublico('cotizacion_publica_get', { p_id: cotId });
    if (!row || row.error) { showError('error.no_encontrada'); return; }
    if (row.es_vip) document.getElementById('vipBadge').style.display = 'inline-block';

    // Idioma definitivo: override del toggle > cliente.idioma > navegador.
    idiomaCliente = row.cliente?.idioma === 'en' ? 'en' : row.cliente?.idioma === 'es' ? 'es' : null;
    idioma = resolverIdioma();
    aplicarIdioma();
    // Texto libre en inglés: un solo batch, sin bloquear el render (originales al 0.6 mientras llega).
    filaActual = row;
    asegurarTraduccion();

    // Loguear apertura del cliente (fire-and-forget, no bloquea el render)
    if (!isPreview) {
      fetch(`${SUPABASE_URL}/rest/v1/rpc/registrar_vista_cotizacion`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ p_cotizacion_id: cotId })
      }).catch(() => {});
    }

    // Pantalla cerrada por sello de aprobación O por estado: una cotización que
    // el taller aprobó a mano (sin sello) o que ya avanzó no vuelve al selector.
    const ESTADOS_CERRADOS = ['aprobado','en_camino','listo','agendado','en_taller','cobrado','perdido'];
    if (row.cliente_aprobado_at || ESTADOS_CERRADOS.includes(row.estado)) {
      mostrarYaAprobado(row);
      return;
    }

    const clienteNombre = [row.cliente?.nombre, row.cliente?.apellido].filter(Boolean).join(' ');

    // El payload ya trae el precio final por opción (misma regla de siempre,
    // calculada en el RPC), las opciones con precio y los repuestos con
    // opciones. repuesto_idx / opcion_idx son los índices REALES del jsonb:
    // la aprobación se manda con ellos, nunca con la posición del arreglo.
    const payload = {
      _cotizacionId: row.id,
      _hash: row.repuestos_hash || null,
      esVip: !!row.es_vip,
      imagenesCliente: Array.isArray(row.imagenes_cliente) ? row.imagenes_cliente : [],
      cliente: {
        nombre: clienteNombre,
        numero: row.numero || null,
        patente: row.vehiculo?.patente || '',
        modelo: row.vehiculo?.modelo || '',
        version: row.vehiculo?.version || '',
        anio: row.vehiculo?.anio || '',
        vin: row.vehiculo?.vin || '',
        fechaCotizacion: row.estado_changed_at || row.created_at || '',
        estado: row.estado || '',
        tieneVehiculo: !!row.vehiculo,
      },
      repuestos: (Array.isArray(row.lineas) ? row.lineas : [])
        .filter(l => l && Array.isArray(l.opciones) && l.opciones.length > 0 && l.repuesto_idx != null)
        .map(l => ({
          repuesto_idx: l.repuesto_idx,
          nombre: l.nombre || '',
          cantidad: Number(l.cantidad) || 1,
          prioridad: l.prioridad || 'Recomendado',
          nota: l.nota || '',
          opciones: l.opciones.map(op => ({
            opcion_idx: op.opcion_idx,
            calidad: op.calidad || '',
            estado: op.estado || '',
            origen: op.origen || 'usa',
            marca: op.marca || '',
            garantia: op.garantia || '',
            precio: Number(op.precio) || 0,
          })),
        })),
    };

    iniciar(payload);
  } catch(e) {
    showError('error.cargar');
  }
}

function mostrarYaAprobado(row) {
  vistaActual = () => mostrarYaAprobado(row);

  // Los _calc se limpian cuando la cotización avanza; leer el canónico primero
  // (`total` = total_aprobado en el payload). VIP: sin adelanto (O6).
  const total = Number(row.total ?? row.total_aprobado_calc ?? 0);

  const adelantoPagado = Number(row.adelanto_realizado ?? 0);
  const faltaAdelanto = Math.max(0, adelantoReq - adelantoPagado);   // contra el 50%, no contra el total

  // Solo en 'aprobado' el cliente aún puede deber el adelanto → mostrar cuentas.

            <div style="color:var(--texto);">

              ${op ? `<div style="color:var(--muted);font-size:12px;margin-top:2px;">${flagHTML(op.origen)} ${esc([tx(op.calidad), op.marca].filter(Boolean).join(' · '))}</div>` : ''}

    cuerpoHTML = seleccionHTML + cuerpoHTML;
  } else if (pendienteAdelanto) {
    // A3 — adelanto cubierto o superado: sin cuentas, confirmación tranquilizadora.
    cuerpoHTML = seleccionHTML + `
      <div class="card mt">
        <div class="nota ok" style="text-align:left;">
          <div style="font-size:16px;font-weight:700;color:var(--ok);">${t('ap.adelanto_cubierto')}</div>
          <div style="font-size:13px;color:var(--texto);margin-top:6px;line-height:1.5;">${t('ap.taller_procedera')}</div>
        </div>
        <div style="text-align:center;color:var(--muted);font-size:13px;margin-top:12px;">
          ${t('ap.ya_abonaste_linea', { monto: fCRC(adelantoPagado) })}
        </div>
        ${lineaSaldo}
      </div>`;
  } else if (estado === 'en_camino') {
    // Rama C — pedido realizado, repuestos en camino.
    const dias = diasHabilesDesde(row.estado_changed_at);
    const badge = dias == null ? '' : t('seg.badge_dias', { dias });
    const fPedido = fechaCR(row.estado_changed_at);
    heroHTML = `
    <div class="cliente-hero" style="margin-top:16px;">
      <h2>${t('seg.hero_pedido')}</h2>
      ${clienteNombre ? `<p style="margin-top:10px;">${esc(clienteNombre)}</p>` : ''}
      ${fPedido ? `<p style="color:var(--muted);font-size:13px;margin-top:6px;">${t('seg.pedido_el', { fecha: esc(fPedido) })}</p>` : ''}
      ${badge ? `<span class="badge-estado">${esc(badge)}</span>` : ''}
    </div>`;
    cuerpoHTML = resumenPedidoHTML
      + tiemposEntregaHTML(origenesAprobados, t('seg.aviso_llegada'))
      + abonoHTML();
  } else if (estado === 'listo' || estado === 'agendado' || estado === 'en_taller') {
    // Rama D — repuestos en el taller: cita agendada o coordinar instalación/retiro.
    // En 'agendado' estado_changed_at es la fecha del agendado, no de la llegada → sin línea.
    // En 'en_taller' el vehículo ya está adentro: sin llegada ni cita, solo resumen y saldo.
    const enTaller = estado === 'en_taller';
    const fLlegada = estado === 'listo' ? fechaCR(row.estado_changed_at) : '';
    heroHTML = `
    <div class="cliente-hero" style="margin-top:16px;">
      <h2>${enTaller ? t('seg.hero_en_taller') : t('seg.hero_listo')}</h2>
      ${clienteNombre ? `<p style="margin-top:10px;">${esc(clienteNombre)}</p>` : ''}
      ${fLlegada ? `<p style="color:var(--muted);font-size:13px;margin-top:6px;">${t('seg.llegaron_el', { fecha: esc(fLlegada) })}</p>` : ''}
    </div>`;
    const retiro = row.con_instalacion === false;
    let citaHTML;
    if (enTaller) {
      citaHTML = '';
    } else if (row.fecha_agendado) {
      // fecha_agendado es DATE (sin hora): solo fecha civil CR.
      citaHTML = `
      <div class="card mt barra-ok" style="text-align:center;">
        <div class="sec-label ok">${t('seg.tu_cita')}</div>
        <div style="font-family:'Titillium Web',sans-serif;font-size:20px;color:var(--texto);text-transform:capitalize;">${esc(fechaCR(row.fecha_agendado, { weekday: 'long' }))}</div>
        <div style="font-size:13px;color:var(--muted);margin-top:8px;">${t('seg.te_esperamos')}</div>
      </div>`;
    } else {
      citaHTML = `
      <div class="card mt" style="text-align:center;">
        <div class="sec-label">${retiro ? t('seg.retiro_titulo') : t('seg.instal_titulo')}</div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5;">${retiro ? t('seg.retiro_texto') : t('seg.instal_texto')}</div>
        <a href="#" id="btnAgendar"
           style="display:inline-flex;align-items:center;gap:8px;padding:12px 20px;background:#25D366;color:#fff;border-radius:8px;text-decoration:none;font-weight:700;font-size:14px;">
          ${retiro ? t('seg.btn_retiro') : t('seg.btn_agendar')}
        </a>
      </div>`;
    }
    cuerpoHTML = resumenPedidoHTML + citaHTML
      + abonoHTML(enTaller ? t('seg.saldo_retirar') : retiro ? t('seg.saldo_entrega') : t('seg.saldo_instalacion'));
  } else {
    // Rama E — cierre (cobrado / perdido, sin distinguir). También es el
    // fallback de cualquier estado no contemplado: hero de cierre sin cards.
    const esCierre = estado === 'cobrado' || estado === 'perdido';
    const fCierre = fechaCR(row.estado_changed_at);
    heroHTML = `
    <div class="cliente-hero" style="margin-top:16px;">
      <h2>${t('cierre.hero')}</h2>
      ${clienteNombre ? `<p style="margin-top:10px;">${esc(clienteNombre)}</p>` : ''}
      <p style="color:var(--texto);font-size:14px;margin-top:8px;">${t('cierre.gracias')}</p>
      ${fCierre ? `<p style="color:var(--muted);font-size:13px;margin-top:6px;">${t('cierre.cerrada_el', { fecha: esc(fCierre) })}</p>` : ''}
    </div>`;
    if (!esCierre) {
      cuerpoHTML = '';
    } else {
      // Resumen con garantía por repuesto (solo si la opción aprobada la trae)
      const resumenCierreHTML = aprobadosSel.length > 0 ? `
      <div class="card mt">
        <div class="sec-label">${t('ap.resumen_pedido')}</div>
        <div class="caja lista" style="display:flex;flex-direction:column;gap:8px;padding-top:8px;">
          ${aprobadosSel.map(({ rep, op }) => `
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:13px;border-bottom:1px solid var(--borde);padding-bottom:8px;">
              <div style="color:var(--texto);">
                ${esc(tx(rep.nombre || ''))}${(rep.cantidad || 1) > 1 ? ` <span style="color:var(--muted);">× ${rep.cantidad}</span>` : ''}
                ${op ? `<div style="color:var(--muted);font-size:12px;margin-top:2px;">${flagHTML(op.origen)} ${esc([tx(op.calidad), op.marca].filter(Boolean).join(' · '))}</div>` : ''}
                ${op && String(op.garantia || '').trim() ? `<div style="color:var(--ok);font-size:12px;margin-top:2px;">${t('garantia_prefijo')}${esc(tx(op.garantia))}</div>` : ''}
              </div>
              ${op && op.precio != null ? `<div style="color:var(--texto);white-space:nowrap;">${fCRC(op.precio)}</div>` : ''}
            </div>`).join('')}
        </div>
      </div>` : '';
      // Resumen de pago: solo si hay total_aprobado (null = cotización sin cierre económico)
      let pagoHTML = '';
      // Solo en 'cobrado': el cobro final va por el libro del Taller y NO
      // actualiza adelanto_realizado, así que acá no se calcula saldo — cobrado
      // es pagado por definición. 'perdido' es cierre interno: sin card.
      if (estado === 'cobrado' && row.total != null) {
        const tot = Number(row.total) || 0;
        pagoHTML = `
      <div class="card mt">
        <div class="sec-label">${t('cierre.resumen_pago')}</div>
        <div class="tabla-resumen">
          ${cajaNeutra(t('cierre.total'), tot)}
          <div class="fila"><span class="lbl">${t('cierre.estado')}</span><span class="monto ok">${t('cierre.pagado')}</span></div>
        </div>
      </div>`;
      }
      const garantiaHTML = `
      <div class="card mt" style="text-align:center;">
        <div class="sec-label">${t('cierre.garantia_titulo')}</div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5;">${t('cierre.garantia_texto')}</div>
        <a href="#" id="btnGarantia"
           style="display:inline-flex;align-items:center;gap:8px;padding:12px 20px;background:#25D366;color:#fff;border-radius:8px;text-decoration:none;font-weight:700;font-size:14px;">
          ${t('cierre.btn_garantia')}
        </a>
      </div>`;
      const reviewHTML = GOOGLE_REVIEW_URL ? `
      <div class="card mt" style="text-align:center;">
        <div class="sec-label">${t('cierre.review_titulo')}</div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5;">${t('cierre.review_texto')}</div>
        <a href="${esc(GOOGLE_REVIEW_URL)}" target="_blank" rel="noopener"
           style="display:inline-flex;align-items:center;gap:8px;padding:12px 20px;background:var(--texto);color:var(--card);border-radius:8px;text-decoration:none;font-weight:700;font-size:14px;">
          ${t('cierre.btn_review')}
        </a>
      </div>` : '';
      // perdido: sin garantía (no hubo entrega al cliente)
      cuerpoHTML = resumenCierreHTML + pagoHTML + (estado === 'perdido' ? '' : garantiaHTML) + reviewHTML;
    }
  }

  const contactoHTML = `
    <div class="card mt" style="text-align:center;">
      <div style="font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5;">
        ${pendienteAdelanto
          ? t('contacto.modificar')
          : t('contacto.dudas')}
      </div>
      <a href="#" id="btnContactarTaller"
         style="display:inline-flex;align-items:center;gap:8px;padding:12px 20px;background:var(--texto);color:var(--card);border-radius:8px;text-decoration:none;font-weight:600;font-size:14px;">
        ${pendienteAdelanto ? t('contacto.btn_modificar') : t('contacto.btn_consultar')}
      </a>
    </div>`;

  document.getElementById('appRoot').innerHTML = heroHTML + cuerpoHTML + contactoHTML;
  pintarEstadoTrad();

  setTimeout(() => {
    const cN = [row.cliente?.nombre, row.cliente?.apellido].filter(Boolean).join(' ') || t('wa.cliente_default');
    const veh = [row.vehiculo?.patente, row.vehiculo?.modelo, row.vehiculo?.anio].filter(Boolean).join(' · ');

    const btn = document.getElementById('btnContactarTaller');
    if (btn) btn.addEventListener('click', function(e) {
      e.preventDefault();
      const cotizacionUrl = `https://cotizaciones.ramosyramoscr.com/?id=${row.id}`;
      const refFolio = folio ? ` ${folio}` : '';
      const vars = { cN, vehL: veh ? t('wa.veh_linea', { veh }) : '', url: cotizacionUrl, refFolio };
      const mensaje = pendienteAdelanto
        ? t('wa.modificacion', vars)
        : estado === 'en_camino'
          ? t('wa.consulta_camino', vars)
          : t('wa.consulta', vars);
      window.open(`https://wa.me/50688872667?text=${encodeURIComponent(mensaje)}`, '_blank');
    });

    // Rama E: reclamo de garantía (mismo número).
    const btnG = document.getElementById('btnGarantia');
    if (btnG) btnG.addEventListener('click', function(e) {
      e.preventDefault();
      const cotizacionUrl = `https://cotizaciones.ramosyramoscr.com/?id=${row.id}`;
      const mensaje = t('wa.garantia', { cN, vehL: veh ? t('wa.veh_linea', { veh }) : '', url: cotizacionUrl, refFolio: folio ? ` ${folio}` : '' });
      window.open(`https://wa.me/50688872667?text=${encodeURIComponent(mensaje)}`, '_blank');
    });

    // Rama D sin cita: agendar instalación / coordinar retiro (mismo número).
    const btnA = document.getElementById('btnAgendar');
    if (btnA) btnA.addEventListener('click', function(e) {
      e.preventDefault();
      const cotizacionUrl = `https://cotizaciones.ramosyramoscr.com/?id=${row.id}`;
      const retiro = row.con_instalacion === false;
      const mensaje = t(retiro ? 'wa.retiro' : 'wa.agendar', { cN, vehL: veh ? t('wa.veh_linea', { veh }) : '', url: cotizacionUrl, refFolio: folio ? ` ${folio}` : '' });
      window.open(`https://wa.me/50688872667?text=${encodeURIComponent(mensaje)}`, '_blank');
    });

    const PAGO_LABELS = { adelanto: t('pago.adelanto'), total: t('pago.total'), otro: t('pago.otro') };
    const btnC = document.getElementById('btnComprobante');
    if (btnC) btnC.addEventListener('click', function(e) {
      e.preventDefault();
      // Resumen completo (el que mandaba el WA automático pre-ea92dd6),
      // reconstruido de aprobadosSel. Históricas: sin selección/decisión → se
      // omiten esas líneas y queda el resumen corto de siempre.
      const lineas = aprobadosSel.map(({ rep, op }) => {
        let l = `• ${tx(rep.nombre) || t('wa.repuesto_default')}${(rep.cantidad || 1) > 1 ? ' (×' + rep.cantidad + ')' : ''}`;
        if (op) {
          const specs = [tx(op.calidad), estadoLabel(op.estado)].filter(Boolean).join(' / ');
          if (specs || op.marca) l += `\n  → ${specs}${op.marca ? (specs ? ' · ' : '') + op.marca : ''}`;
          l += t('wa.comp_origen', { o: nombreOrigen(op.origen) });
          if (op.garantia) l += `\n  → 🛡️ ${tx(op.garantia)}`;
          if (op.precio != null) l += `\n  → ${fCRC(op.precio)}`;
        }
        return l;
      });
      const armar = (incluidas) => {
        let m = t('wa.comp_titulo', { cN });
        if (veh) m += t('wa.comp_veh', { veh });
        if (incluidas.length > 0) {
          m += t('wa.comp_repuestos') + incluidas.join('\n');
          if (incluidas.length < lineas.length) m += t('wa.comp_mas', { n: lineas.length - incluidas.length });
        }
        m += t('wa.comp_total', { monto: fCRC(total) });
        if (row.monto_pago_elegido != null) m += t('wa.comp_monto', { monto: fCRC(row.monto_pago_elegido) }) + (row.pago_elegido ? ` (${PAGO_LABELS[row.pago_elegido] || row.pago_elegido})` : '');
        if (row.con_instalacion != null) m += t('wa.comp_instalacion', { v: row.con_instalacion ? t('si') : t('no') });
        m += t('wa.comp_adjunto');
        return m;
      };
      // wa.me tolera ~2000 chars de URL: truncar la lista ("… y N más")
      // hasta caber, conservando siempre total/monto/cierre.
      const incluidas = lineas.slice();
      let url = `https://wa.me/50688872667?text=${encodeURIComponent(armar(incluidas))}`;
      while (url.length > 1900 && incluidas.length > 0) {
        incluidas.pop();
        url = `https://wa.me/50688872667?text=${encodeURIComponent(armar(incluidas))}`;
      }
      window.open(url, '_blank');
    });
  }, 0);
}

cargar();

// Bloque de cuentas de pago: datos de taller_config.cuentas_pago (los manda
// el RPC SOLO en estado 'aprobado' y en la pantalla de selección no hace
// falta). Mismo diseño de siempre; los textos fijos siguen en I18N. La intro
// en ES es la editable del taller (cp.intro); en EN, la traducción estática.
// Reutilizado por mostrarYaAprobado() en A1/A2 (para pagar el adelanto).
function cuentasBancariasHTML(cp) {
  if (!cp || typeof cp !== 'object') return '';
  const cuentas = Array.isArray(cp.cuentas) ? cp.cuentas : [];
  const btnCopiar = v => `<button onclick="copiarTexto('${esc(String(v).replace(/'/g, ''))}', this)" style="background:none;border:1px solid var(--borde);border-radius:6px;padding:6px;font-size:12px;min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;">📋</button>`;
  const intro = idioma === 'en' || !cp.intro
    ? `${t('cuentas.intro1')}<br>${t('cuentas.intro2')}`
    : esc(cp.intro);
  const cuentaHTML = c => `
      <div class="caja">
        <div class="sec-label">${c.moneda === 'USD' ? '💵' : '🏦'} ${t('cuentas.cuenta', { banco: esc(c.banco || ''), moneda: c.moneda === 'USD' ? t('cuentas.dolares') : t('cuentas.colones') })}</div>
        <div style="font-size:13px;line-height:2;color:var(--texto);">
          ${c.titular ? `<div><span style="color:var(--muted);">${t('cuentas.titular')}</span> ${esc(c.titular)}</div>` : ''}
          ${c.numero ? `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <span style="color:var(--muted);">${t('cuentas.numero')}</span> <strong>${esc(c.numero)}</strong>
            ${btnCopiar(c.numero)}
          </div>` : ''}
          ${c.iban ? `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <span style="color:var(--muted);">IBAN:</span> <strong>${esc(c.iban)}</strong>
            ${btnCopiar(c.iban)}
          </div>` : ''}
        </div>
      </div>`;
  const sinpe = cp.sinpe && cp.sinpe.numero ? `
    <div class="caja" style="display:flex;align-items:center;gap:14px;">
      <div style="font-size:28px;">📱</div>
      <div style="flex:1;">
        <div class="sec-label">${t('cuentas.sinpe')}</div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="font-family:'Titillium Web',sans-serif;font-size:26px;letter-spacing:2px;color:var(--marca);">${esc(cp.sinpe.numero)}</div>
          ${btnCopiar(String(cp.sinpe.numero).replace(/\D/g, ''))}
        </div>
        ${cp.sinpe.titular ? `<div style="font-size:12px;color:var(--muted);">${esc(cp.sinpe.titular)}</div>` : ''}
      </div>
    </div>` : '';
  return `
  <div class="card mt">
    <div class="sec-label">${t('cuentas.titulo')}
    </div>
    <div class="caja" style="margin-bottom:16px;font-size:14px;line-height:1.6;">
      ${intro}
    </div>
    ${cuentas.length > 0 ? `<div class="pago-grid-2col" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">${cuentas.map(cuentaHTML).join('')}</div>` : ''}
    ${sinpe}
  </div>`;
}

// Tiempos de entrega como card propia: info de decisión (USA vs Europa) que el
// cliente necesita ANTES de aprobar — se muestra en la pantalla de selección y
// también post-aprobación (A1/A2), separada de las instrucciones de pago.
// `origenes` (['usa'|'europa']) resalta la(s) fila(s) que aplican al pedido;
// `pie` reemplaza la nota estática (ramas de seguimiento, donde el IVA y el
// día de pedido ya no son información de decisión).
function tiemposEntregaHTML(origenes = null, pie = null) {
  const fila = (key, cls, txt) => {
    const on = Array.isArray(origenes) && origenes.includes(key);
    return `
      <div class="fila-tiempo${on ? ' aplica' : ''}" style="display:flex;align-items:center;gap:10px;font-size:13px;">
        <span class="mf ${cls}"></span>
        <div>${txt}${on ? ` <span class="fila-tiempo-tag">${t('tiempos.tu_pedido')}</span>` : ''}</div>
      </div>`;
  };
  return `
  <div class="card mt">
    <div class="sec-label">${t('tiempos.titulo')}</div>
    <div class="caja" style="display:flex;flex-direction:column;gap:8px;">
      ${fila('usa', 'us', t('tiempos.usa'))}
      ${fila('europa', 'eu', t('tiempos.europa'))}
      ${fila('china', 'cn', t('tiempos.china'))}
    </div>
    <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--borde);font-size:12px;color:var(--muted);">
      ${pie ? esc(pie) : t('tiempos.pie')}
    </div>
  </div>`;
}

function iniciar(payload) {
  const { cliente, repuestos: reps, imagenesCliente, esVip } = payload;
  // Cotización vencida: 'cotizado' + created_at con más de 30 días. Bloquea la aprobación (no toca la vista "ya aprobada").
  const vencida = !!cliente.fechaCotizacion
    && (new Date(cliente.fechaCotizacion).getTime() + 30*24*60*60*1000) < Date.now()
    && cliente.estado === 'cotizado';
  const bannerVencida = `
    <div class="card barra-alerta">
      <div style="font-family:'Titillium Web',sans-serif;font-size:16px;letter-spacing:1px;color:var(--alerta);font-weight:700;text-transform:uppercase;margin-bottom:8px;">${t('venc.titulo')}</div>
      <div style="font-size:14px;color:var(--texto);line-height:1.55;">${t('venc.texto')}</div>
    </div>`;
  const sel = new Array(reps.length).fill(null);

  function placaHTML(patente) {
    const p = (patente || '').trim();
    const AZUL = '#1B2A7A';
    if (!p) {
      return `<span style="position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:#DDDDD6;border:2.5px solid #9aa0a6;border-radius:6px;padding:8px 28px 9px;min-width:130px;line-height:1;white-space:nowrap;vertical-align:middle;">
        <span style="font-family:'Inter','Titillium Web',sans-serif;font-size:6.5px;letter-spacing:2.2px;color:#8a8a8a;font-weight:700;margin-bottom:3px;">COSTA RICA</span>
        <span style="font-family:'Inter','Titillium Web',sans-serif;font-size:24px;font-weight:700;color:#8a8a8a;letter-spacing:2.5px;text-transform:uppercase;">S/P</span>
        <span style="font-family:'Inter','Titillium Web',sans-serif;font-size:6px;letter-spacing:1.6px;color:#8a8a8a;font-weight:700;margin-top:3px;">CENTROAMÉRICA</span>
      </span>`;
    }
    return `<span style="position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#E6E6E0 0%,#D5D5CE 100%);opacity:0.95;border:2.5px solid ${AZUL};border-radius:6px;padding:8px 28px 9px;min-width:130px;line-height:1;box-shadow:0 0 0 1px #9aa0a6;white-space:nowrap;vertical-align:middle;">
      <span style="position:absolute;top:5px;left:20%;width:11px;height:3.5px;border-radius:2px;background:#C9CCC9;box-shadow:inset 0 1px 1.5px rgba(0,0,0,0.45);"></span>
      <span style="position:absolute;top:5px;right:20%;width:11px;height:3.5px;border-radius:2px;background:#C9CCC9;box-shadow:inset 0 1px 1.5px rgba(0,0,0,0.45);"></span>
      <svg viewBox="0 0 9 6" preserveAspectRatio="none" style="position:absolute;top:5px;right:5px;width:16px;height:10px;border-radius:1.5px;box-shadow:0 0 0 0.5px rgba(0,0,0,0.18);overflow:hidden;display:block;">

      <div style="font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-top:16px;">Taller Ramos y Ramos · San José, Costa Rica</div>
    </div>`;
    document.getElementById('appRoot').innerHTML = hero + galeriaHTML + (vencida ? bannerVencida : instrucciones) + repsHTML + (vencida ? '' : resumenHTML) + tiemposEntregaHTML() + footer;
    pintarEstadoTrad();
  }

  window.seleccionar = function(ri, oi) {
    sel[ri] = oi;
    render();
  };

  window.actualizarPago = function(total) {
    const opt = document.querySelector('input[name="pago_opt"]:checked')?.value;
    const wrap = document.getElementById('otro_monto_wrap');
    if (wrap) wrap.style.display = opt === 'otro' ? 'block' : 'none';
  };

  window.handleSubmitClick = function() {
    if (vencida) return;  // red de seguridad: no aprobar cotizaciones vencidas
    const unmarked = [];
    for (let i = 0; i < reps.length; i++) {
      if (sel[i] === null) {
        unmarked.push(reps[i].nombre);
      }
    }
    if (unmarked.length === 0) {
      confirmarAprobacion();
    } else {
      showConfirmModal(unmarked);
    }
  };

  function showConfirmModal(unmarked) {
    const existing = document.getElementById('confirmModal');
    if (existing) existing.remove();

    const overlay = document.createElement('div');
    overlay.id = 'confirmModal';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.72);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px;';
    overlay.innerHTML = `
      <div id="modalContent" style="background:var(--card);border:1px solid var(--borde);border-radius:8px;padding:24px;max-width:450px;width:100%;max-height:90vh;overflow-y:auto;box-sizing:border-box;">
        <div style="font-weight:600;font-size:17px;color:var(--texto);margin-bottom:14px;">${t('modal.titulo')}</div>
        <p style="font-size:14px;color:var(--muted);margin-bottom:12px;line-height:1.5;">${t('modal.texto')}</p>
        <ul style="padding-left:20px;color:var(--texto);line-height:1.8;margin:0 0 4px;">
          ${unmarked.map(n => `<li>${esc(tx(n))}</li>`).join('')}
        </ul>
        <p style="margin-top:18px;font-weight:500;color:var(--texto);font-size:15px;">${t('modal.confirmar_q')}</p>
        <div id="modalBtnRow" style="margin-top:22px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;">
          <button id="btnModalVolver" style="background:var(--card);color:var(--texto);padding:11px 20px;border-radius:6px;border:none;cursor:pointer;font-size:14px;min-width:100px;">${t('modal.volver')}</button>
          <button id="btnModalConfirmar" style="background:var(--marca);color:var(--card);padding:11px 20px;border-radius:6px;border:none;cursor:pointer;font-size:14px;font-weight:600;min-width:140px;">${t('modal.confirmar')}</button>
        </div>
      </div>`;

    document.body.appendChild(overlay);

    if (window.innerWidth < 480) {
      const btnRow = document.getElementById('modalBtnRow');
      btnRow.style.flexDirection = 'column-reverse';
      btnRow.querySelectorAll('button').forEach(b => { b.style.width = '100%'; b.style.padding = '12px 20px'; });
      document.getElementById('modalContent').style.padding = '20px';
    }

    document.getElementById('btnModalVolver').addEventListener('click', () => overlay.remove());
    document.getElementById('btnModalConfirmar').addEventListener('click', () => { overlay.remove(); confirmarAprobacion(); });
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    const escHandler = e => { if (e.key === 'Escape') { overlay.remove(); document.removeEventListener('keydown', escHandler); } };
    document.addEventListener('keydown', escHandler);
  }

  window.confirmarAprobacion = function() {
    const modal = document.createElement('div');
    modal.id = 'modalInstalacion';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;';
    modal.innerHTML = `
      <div style="background:var(--card);border:1px solid var(--borde);border-radius:8px;padding:28px;max-width:400px;width:100%;text-align:center;">
        <div style="font-family:'Titillium Web',sans-serif;font-size:22px;letter-spacing:1.5px;color:var(--marca);margin-bottom:10px;">${t('mo.titulo')}</div>
        <p style="font-size:14px;color:var(--texto);line-height:1.6;margin-bottom:24px;">${t('mo.texto')}</p>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <button onclick="procesarAprobacion(true)" style="background:var(--marca);color:var(--card);border:none;border-radius:8px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;">${t('mo.si')}</button>
          <button onclick="procesarAprobacion(false)" style="background:var(--card);color:var(--texto);border:1px solid var(--borde);border-radius:8px;padding:14px;font-size:14px;cursor:pointer;">${t('mo.no')}</button>
          <button onclick="document.getElementById('modalInstalacion').remove()" style="background:transparent;color:var(--muted);border:none;border-radius:8px;padding:14px;font-size:14px;cursor:pointer;">${t('mo.volver')}</button>
        </div>
      </div>`;
    // Cerrar tocando el fondo: solo si el tap fue en el overlay mismo,
    // no dentro de la tarjeta (los clicks internos no burbujean como e.target=modal).
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
    document.body.appendChild(modal);
  };

  window.procesarAprobacion = async function(conInstalacion) {
    if (isPreview) return;  // defensa extra: en preview nunca se aprueba
    document.getElementById('modalInstalacion')?.remove();
    const aprobados = reps.map((r,ri) => ({r, oi: sel[ri]})).filter(x => x.oi !== null && x.oi >= 0);
    const total = aprobados.reduce((sum,x) => sum + x.r.opciones[x.oi].precio, 0);
    // VIP (O6): sin adelanto — se manda 'adelanto' con monto 0 y el RPC lo valida.
    const adelantoMin = esVip ? 0 : Math.round(total * 0.5);

    const optPago = esVip ? 'adelanto' : (document.querySelector('input[name="pago_opt"]:checked')?.value || 'adelanto');
    let montoPago = adelantoMin;
    if (!esVip && optPago === 'total') {
      montoPago = total;
    } else if (!esVip && optPago === 'otro') {
      const inp = parseInt(document.getElementById('inp_otro_monto')?.value, 10) || 0;
      if (inp < adelantoMin || inp > total) {
        const err = document.getElementById('inp_otro_error');
        if (err) err.style.display = 'block';
        return;
      }
      montoPago = inp;
    }
    const btn = document.getElementById('btnConfirmar');
    const status = document.getElementById('confirmStatus');
    if (btn) btn.disabled = true;
    if (status) status.innerHTML = `<p style="color:var(--muted);font-size:13px;">${t('guardando')}</p>`;

    try {
      // Selección por índices REALES del jsonb (repuesto_idx / opcion_idx del
      // payload). "No deseo" y sin decidir van rechazados; el RPC valida rango,
      // unicidad y precio, y lo guarda normalizado.
      const clienteSeleccion = reps.map((r, ri) => {
        const oi = sel[ri];
        const op = oi !== null && oi >= 0 ? r.opciones[oi] : null;
        return op
          ? { repuesto_idx: r.repuesto_idx, opcion_idx: op.opcion_idx, rejected: false }
          : { repuesto_idx: r.repuesto_idx, opcion_idx: null, rejected: true };
      });

      // Lock + guard + hash + totales viven en el RPC (lote 1). Sin PATCH.
      const r = await rpcPublico('cotizacion_publica_aprobar', {
        p_id: payload._cotizacionId,
        p_seleccion: clienteSeleccion,
        p_con_instalacion: !!conInstalacion,
        p_pago: optPago,
        p_monto: montoPago,
        p_hash: payload._hash,
      });
      if (r && r.error) {
        if (r.error === 'ya_aprobada') {            // otra pestaña / el taller ya la aprobó
          alert(t('alert.ya_aprobada'));
          window.location.reload();
          return;
        }
        if (r.error === 'cotizacion_cambio') {      // el taller editó la lista: recargar y volver a elegir
          alert(t('alert.cambio'));
          window.location.reload();
          return;
        }
        const key = 'err.' + r.error;
        const msg = I18N.es[key] ? t(key) : t('err.generico');
        if (status) status.innerHTML = `<p style="color:var(--marca);font-size:13px;">${esc(msg)}</p>`;
        if (btn) btn.disabled = false;
        return;
      }

      // Aviso al taller: el server arma título/cuerpo/url/tag desde la fila
      // (exige el sello reciente). Fire-and-forget.
      fetch(`${SUPABASE_URL}/functions/v1/send-push`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_KEY },
        body: JSON.stringify({ event_type: 'cotizacion_aprobada', cotizacion_id: payload._cotizacionId }),
      }).catch(() => {});

      // Transición a la pantalla de aprobado con el payload fresco (líneas
      // aprobadas con su opción, totales y cuentas). El comprobante por
      // WhatsApp es un botón de esa pantalla — sin WA automático.
      try {
        const rrow = await rpcPublico('cotizacion_publica_get', { p_id: payload._cotizacionId });
        if (!rrow || rrow.error) throw new Error('sin fila');
        window.scrollTo({ top: 0, behavior: 'auto' });
        filaActual = rrow;
        mostrarYaAprobado(rrow);
      } catch(_) {
        window.location.reload();  // cargar() bifurca solo a la pantalla de aprobado
      }
    } catch(e) {
      if (status) status.innerHTML = `<p style="color:var(--marca);font-size:13px;">${t('error.guardar', { msg: esc(e.message) })}</p>`;
      if (btn) btn.disabled = false;
    }
  };

  vistaActual = render;
  render();
}
</script>
</body>
</html>
